<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA-Consulting | Secure Your Digital Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { 
            --aa-blue: #3b82f6; 
            --obsidian: #020617; 
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--obsidian); 
            color: #94a3b8; 
            margin: 0;
            overflow-x: hidden;
        }
        
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, rgba(2, 6, 23, 0.95) 25%, rgba(2, 6, 23, 0.1) 100%), 
                        url('images/Background.png');
            background-size: contain; 
            background-position: right top 110px; 
            background-repeat: no-repeat;
            background-attachment: scroll; 
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 100px;
            margin-top: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .nav-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.15)) brightness(1.1);
        }

        .text-catchy {
            font-weight: 900;
            background: linear-gradient(90deg, #3b82f6, #ef4444, #ffffff, #ef4444, #3b82f6);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-size: 200% auto; 
            animation: gradientMove 4s linear infinite;
        }
        
        @keyframes gradientMove { 
            to { background-position: 200% center; } 
        }

        .partner-card {
            background: #ffffff; 
            border-radius: 12px; 
            padding: 1.5rem; 
            height: 140px;
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .partner-card:hover { 
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(59, 130, 246, 0.2);
        }
        
        .partner-logo { 
            max-width: 85%; 
            max-height: 65px; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Metadata Header -->
        <div class="w-full py-3 px-6 md:px-12 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 border-b border-white/5 bg-black/40">
            <div class="max-w-screen-2xl mx-auto flex justify-between">
                <span>📍 ISRAEL • ETHIOPIA • NIGERIA</span>
                <span class="text-blue-500 uppercase tracking-widest">Secure Your Digital Capital</span>
            </div>
        </div>

        <!-- Floating Curved Glass Navigation -->
        <div class="px-6 md:px-12 relative z-20">
            <div class="max-w-screen-2xl mx-auto glass-nav">
                <nav class="flex justify-between items-center px-10 py-3 w-full">
                    <div class="flex items-center gap-6">
                        <img src="images/AA logo.png" alt="AA Consulting Logo" class="nav-logo">
                        <div class="h-8 w-[1px] bg-white/20 hidden lg:block"></div>
                        <span class="text-white font-extrabold text-xl tracking-tighter uppercase hidden sm:block">AA-Consulting</span>
                    </div>
                    
                    <!-- Updated Navigation Links -->
                    <div class="hidden md:flex gap-10 text-[11px] font-bold uppercase tracking-widest text-slate-300 items-center">
                        <a href="index.html" class="text-white border-b-2 border-blue-500 pb-1">Home</a>
                        <a href="about.html" class="hover:text-white transition">About Us</a>
                        <a href="solutions.html" class="hover:text-white transition">Solutions</a>
                        <a href="resources.html" class="hover:text-white transition">Resources</a>
                        
                        <!-- Contact Us Button in Nav -->
                       <a href="contact.html" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full transition-all shadow-lg shadow-blue-600/20">Contact Us</a>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow flex flex-col pt-24 px-6 md:px-12 pb-16">
            <div class="max-w-screen-2xl mx-auto w-full" data-aos="fade-right">
                <h1 class="text-7xl lg:text-9xl font-black text-white leading-[0.85] tracking-tighter mb-10">
                    Securing Your <br> <span class="text-catchy">Digital Assets.</span>
                </h1>
                <p class="text-slate-300 text-xl font-medium leading-relaxed max-w-lg mb-12">
                    Aggressive information security for enterprise. <br>
                    Headquartered in Israel, deployed locally in Lagos.
                </p>
                <div class="mb-20">
                    <a href="solutions.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-6 px-16 rounded-full text-[11px] uppercase tracking-[0.2em] transition-all shadow-lg shadow-blue-600/20">
                        Explore Solutions
                    </a>
                </div>

                <!-- Partner Grid -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 lg:gap-8 w-full" data-aos="fade-up" data-aos-delay="200">
                    <div class="partner-card"><img src="images/Rapid7 logo.png" class="partner-logo" alt="Rapid7"></div>
                    <div class="partner-card"><img src="images/VRX LOGO.png" class="partner-logo" alt="VRX"></div>
                    <div class="partner-card"><img src="images/CyberArk Software, Ltd. - Partner Logo.png" class="partner-logo" alt="CyberArk"></div>
                    <div class="partner-card"><img src="images/SecuPi-logo.png" class="partner-logo" alt="SecuPi"></div>
                    <div class="partner-card"><img src="images/Trellix_Logo.svg.png" class="partner-logo" alt="Trellix"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ 
            duration: 1000, 
            once: true 
        });
    </script>
</body>
</html>
